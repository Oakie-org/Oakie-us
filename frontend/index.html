<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Oakie: find your people, build your world. Publish projects, recruit teammates across disciplines, and earn verifiable contribution records."
    />
    <meta name="theme-color" content="#F6F5EF" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Oakie</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("oakie-theme");
        if (!t)
          t = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
