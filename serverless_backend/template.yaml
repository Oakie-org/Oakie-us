AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Oakie Backend (FastAPI + Lambda + DynamoDB + Cognito)

Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Runtime: python3.11
    Architectures:
      - x86_64

Resources:
  # -------------------------------------------------------------------------
  # DynamoDB Table (Users)
  # -------------------------------------------------------------------------
  OakieTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Oakie-Users
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  # -------------------------------------------------------------------------
  # DynamoDB Table (Projects)
  # -------------------------------------------------------------------------
  OakieProjectsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Oakie-Projects
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  # -------------------------------------------------------------------------
  # Lambda Trigger: Post Confirmation (Sync to DDB)
  # -------------------------------------------------------------------------
  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: app.triggers.post_confirmation.handler
      Environment:
        Variables:
          USER_TABLE_NAME: !Ref OakieTable
          # Note: User Pool ID is extracted from the event, not env var
          # This breaks circular dependency with OakieUserPool
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OakieTable
        # Permission to add users to any Cognito group in this account
        # Using wildcard to avoid circular dependency
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminAddUserToGroup
              Resource: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*

  # -------------------------------------------------------------------------
  # Cognito User Pool Groups (Role-Based Access Control)
  # -------------------------------------------------------------------------
  # Precedence: lower number = higher priority (appears first in cognito:groups claim)

  SuperAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: super_admin
      UserPoolId: !Ref OakieUserPool
      Description: Super administrators with full platform access
      Precedence: 0

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      UserPoolId: !Ref OakieUserPool
      Description: Platform administrators - user and content management
      Precedence: 1

  ModeratorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: moderator
      UserPoolId: !Ref OakieUserPool
      Description: Content moderators - review projects and handle reports
      Precedence: 2

  CreatorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: creator
      UserPoolId: !Ref OakieUserPool
      Description: Verified creators - can create and manage projects
      Precedence: 10

  UserGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: user
      UserPoolId: !Ref OakieUserPool
      Description: Standard users - browse and apply to projects
      Precedence: 100

  # -------------------------------------------------------------------------
  # Cognito User Pool
  # -------------------------------------------------------------------------
  OakieUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: Oakie-UserPool
      LambdaConfig:
        PostConfirmation: !GetAtt PostConfirmationFunction.Arn
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true

  # -------------------------------------------------------------------------
  # Cognito User Pool Domain (For Hosted UI)
  # -------------------------------------------------------------------------
  OakieUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      # Domain prefix must be unique across AWS region.
      # Using 'oakie-login-${AWS::AccountId}' to ensure uniqueness.
      Domain: !Sub oakie-login-${AWS::AccountId}
      UserPoolId: !Ref OakieUserPool

  # Permission for Cognito to invoke Lambda
  PostConfirmationInvocationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt PostConfirmationFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt OakieUserPool.Arn

  # -------------------------------------------------------------------------
  # Cognito User Pool Client (Public for Web/Mobile)
  # -------------------------------------------------------------------------
  OakieUserClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref OakieUserPool
      ClientName: Oakie-Web
      GenerateSecret: false # Public client for SPA/Mobile
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH   # For simple password auth (testing)
        - ALLOW_USER_SRP_AUTH         # For SRP auth (frontend)
        - ALLOW_REFRESH_TOKEN_AUTH    # For token refresh
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - http://localhost:3000/ # For local dev
        - https://oakie.com/ # Placeholder for production
      LogoutURLs:
        - http://localhost:3000/
      AllowedOAuthFlows:
        - code
        - implicit
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - email
        - openid
        - profile

  # -------------------------------------------------------------------------
  # Lambda Function (FastAPI Monolith)
  # -------------------------------------------------------------------------
  FastAPIFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: app.main.handler
      Environment:
        Variables:
          USERS_TABLE_NAME: !Ref OakieTable
          PROJECTS_TABLE_NAME: !Ref OakieProjectsTable
          COGNITO_USER_POOL_ID: !Ref OakieUserPool
          COGNITO_CLIENT_ID: !Ref OakieUserClient
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OakieTable
        - DynamoDBCrudPolicy:
            TableName: !Ref OakieProjectsTable
      Events:
        HttpApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref OakieApi
        PublicRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref OakieApi
            Path: /
            Method: GET
            Auth:
              Authorizer: NONE
        PublicProjectsList:
          Type: HttpApi
          Properties:
            ApiId: !Ref OakieApi
            Path: /api/v1/projects
            Method: GET
            Auth:
              Authorizer: NONE
        PublicProjectsDetail:
          Type: HttpApi
          Properties:
            ApiId: !Ref OakieApi
            Path: /api/v1/projects/{id}
            Method: GET
            Auth:
              Authorizer: NONE

  # -------------------------------------------------------------------------
  # API Gateway (HTTP API)
  # -------------------------------------------------------------------------
  OakieApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${OakieUserPool}"
              audience:
                - !Ref OakieUserClient
            IdentitySource: "$request.header.Authorization"
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        AllowHeaders:
          - "*"
        AllowOrigins:
          - "*"

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${OakieApi}.execute-api.${AWS::Region}.amazonaws.com/"
  UserPoolId:
    Description: "Cognito User Pool ID"
    Value: !Ref OakieUserPool
  ClientId:
    Description: "Cognito App Client ID"
    Value: !Ref OakieUserClient
  HostedUIUrl:
    Description: "Hosted UI Login URL"
    Value: !Sub "https://${OakieUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/login?client_id=${OakieUserClient}&response_type=token&scope=email+openid+profile&redirect_uri=http://localhost:3000/"
