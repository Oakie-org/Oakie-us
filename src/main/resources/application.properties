spring.application.name=dadaIsland

# DataSource configuration for local development
spring.datasource.url=jdbc:mysql://localhost:3306/dada_island?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=dada
spring.datasource.password=dev_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis configuration
mybatis.mapper-locations=classpath*:mapper/**/*.xml
mybatis.type-aliases-package=com.phz.dadaIsland.domain

# Flyway migration settings
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# RocketMQ base configuration
rocketmq.name-server=localhost:9876
