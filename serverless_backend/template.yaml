AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Oakie backend: FastAPI on Lambda behind an HTTP API, one DynamoDB table,
  Cognito for identity and S3 for uploads.

Parameters:
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: "http://localhost:5173"
    Description: Web origins allowed to call the API and upload to the bucket.
  ProjectCreationMinRole:
    Type: String
    Default: user
    AllowedValues: [user, creator, moderator, admin]
    Description: Lowest Cognito group allowed to publish a project.

Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Runtime: python3.11
    Architectures:
      - x86_64
    Environment:
      Variables:
        TABLE_NAME: !Ref OakieTable

Resources:
  # -------------------------------------------------------------------------
  # DynamoDB: single table. Key layout is documented in app/db/schema.py and
  # must stay in sync with it.
  # -------------------------------------------------------------------------
  OakieTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: gsi1_pk, AttributeType: S }
        - { AttributeName: gsi1_sk, AttributeType: S }
        - { AttributeName: gsi2_pk, AttributeType: S }
        - { AttributeName: gsi2_sk, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: gsi1_pk, KeyType: HASH }
            - { AttributeName: gsi1_sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: GSI2
          KeySchema:
            - { AttributeName: gsi2_pk, KeyType: HASH }
            - { AttributeName: gsi2_sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  # -------------------------------------------------------------------------
  # S3: image uploads (browser-direct presigned POST, public read)
  # -------------------------------------------------------------------------
  OakieUploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, POST]
            AllowedOrigins: !Ref AllowedOrigins
            MaxAge: 3000
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  OakieUploadsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref OakieUploadsBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub ${OakieUploadsBucket.Arn}/*

  # -------------------------------------------------------------------------
  # Cognito: user pool, web client, role groups, PostConfirmation trigger
  # -------------------------------------------------------------------------
  OakieUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: Oakie-UserPool
      LambdaConfig:
        PostConfirmation: !GetAtt PostConfirmationFunction.Arn
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true

  OakieUserClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref OakieUserPool
      ClientName: Oakie-Web
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # Lower precedence number = higher priority in the cognito:groups claim.
  SuperAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { GroupName: super_admin, UserPoolId: !Ref OakieUserPool, Precedence: 0 }
  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { GroupName: admin, UserPoolId: !Ref OakieUserPool, Precedence: 1 }
  ModeratorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { GroupName: moderator, UserPoolId: !Ref OakieUserPool, Precedence: 2 }
  CreatorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { GroupName: creator, UserPoolId: !Ref OakieUserPool, Precedence: 10 }
  UserGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { GroupName: user, UserPoolId: !Ref OakieUserPool, Precedence: 100 }

  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: app.triggers.post_confirmation.handler
      Environment:
        Variables:
          # The trigger never verifies tokens, but shares the app's settings module.
          AUTH_MODE: cognito
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OakieTable
        # The pool is referenced by wildcard to avoid a circular dependency with
        # OakieUserPool; the trigger reads the pool id from the event.
        - Statement:
            - Effect: Allow
              Action: cognito-idp:AdminAddUserToGroup
              Resource: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*

  PostConfirmationInvocationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt PostConfirmationFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt OakieUserPool.Arn

  # -------------------------------------------------------------------------
  # API: one Lambda serves every route.
  #
  # The gateway's JWT authorizer guards everything by default. Routes that
  # anonymous visitors may read are opened below; the app still verifies any
  # token it is sent, so these stay safe for signed-in callers too.
  # -------------------------------------------------------------------------
  OakieApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${OakieUserPool}"
              audience:
                - !Ref OakieUserClient
      CorsConfiguration:
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        AllowHeaders: [authorization, content-type]
        AllowOrigins: !Ref AllowedOrigins

  FastAPIFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: app.main.handler
      Environment:
        Variables:
          AUTH_MODE: cognito
          UPLOADS_BUCKET_NAME: !Ref OakieUploadsBucket
          COGNITO_USER_POOL_ID: !Ref OakieUserPool
          COGNITO_CLIENT_ID: !Ref OakieUserClient
          CORS_ORIGINS: !Join [",", !Ref AllowedOrigins]
          PROJECT_CREATION_MIN_ROLE: !Ref ProjectCreationMinRole
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OakieTable
        - S3WritePolicy:
            BucketName: !Ref OakieUploadsBucket
      Events:
        Protected:
          Type: HttpApi
          Properties: { ApiId: !Ref OakieApi }
        PublicCatalog:
          Type: HttpApi
          Properties: { ApiId: !Ref OakieApi, Method: GET, Path: /api/v1/meta, Auth: { Authorizer: NONE } }
        PublicStats:
          Type: HttpApi
          Properties: { ApiId: !Ref OakieApi, Method: GET, Path: /api/v1/stats/overview, Auth: { Authorizer: NONE } }
        PublicProjects:
          Type: HttpApi
          Properties: { ApiId: !Ref OakieApi, Method: GET, Path: /api/v1/projects, Auth: { Authorizer: NONE } }
        PublicProjectFacets:
          Type: HttpApi
          Properties: { ApiId: !Ref OakieApi, Method: GET, Path: /api/v1/projects/facets, Auth: { Authorizer: NONE } }
        PublicSearchSuggest:
          Type: HttpApi
          Properties: { ApiId: !Ref OakieApi, Method: GET, Path: /api/v1/search/suggest, Auth: { Authorizer: NONE } }
        PublicUserFollowers:
          Type: HttpApi
          Properties: { ApiId: !Ref OakieApi, Method: GET, Path: "/api/v1/users/{user_id}/followers", Auth: { Authorizer: NONE } }
        PublicUserFollowing:
          Type: HttpApi
          Properties: { ApiId: !Ref OakieApi, Method: GET, Path: "/api/v1/users/{user_id}/following", Auth: { Authorizer: NONE } }
        PublicProject:
          Type: HttpApi
          Properties: { ApiId: !Ref OakieApi, Method: GET, Path: "/api/v1/projects/{project_id}", Auth: { Authorizer: NONE } }
        PublicProjectMembers:
          Type: HttpApi
          Properties: { ApiId: !Ref OakieApi, Method: GET, Path: "/api/v1/projects/{project_id}/members", Auth: { Authorizer: NONE } }
        PublicProjectTimeline:
          Type: HttpApi
          Properties: { ApiId: !Ref OakieApi, Method: GET, Path: "/api/v1/projects/{project_id}/timeline", Auth: { Authorizer: NONE } }
        PublicTalent:
          Type: HttpApi
          Properties: { ApiId: !Ref OakieApi, Method: GET, Path: /api/v1/talent, Auth: { Authorizer: NONE } }
        PublicUser:
          Type: HttpApi
          Properties: { ApiId: !Ref OakieApi, Method: GET, Path: "/api/v1/users/{user_id}", Auth: { Authorizer: NONE } }
        PublicUserProjects:
          Type: HttpApi
          Properties: { ApiId: !Ref OakieApi, Method: GET, Path: "/api/v1/users/{user_id}/projects", Auth: { Authorizer: NONE } }
        PublicUserContributions:
          Type: HttpApi
          Properties: { ApiId: !Ref OakieApi, Method: GET, Path: "/api/v1/users/{user_id}/contributions", Auth: { Authorizer: NONE } }
        PublicContributionProof:
          Type: HttpApi
          Properties: { ApiId: !Ref OakieApi, Method: GET, Path: "/api/v1/contributions/{code}", Auth: { Authorizer: NONE } }

Outputs:
  ApiUrl:
    Description: API Gateway endpoint (frontend VITE_API_BASE_URL)
    Value: !Sub "https://${OakieApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserPoolId:
    Description: Cognito User Pool ID (frontend VITE_COGNITO_USER_POOL_ID)
    Value: !Ref OakieUserPool
  ClientId:
    Description: Cognito app client ID (frontend VITE_COGNITO_CLIENT_ID)
    Value: !Ref OakieUserClient
  TableName:
    Value: !Ref OakieTable
  UploadsBucket:
    Value: !Ref OakieUploadsBucket
