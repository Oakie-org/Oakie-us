spring.application.name=dadaIsland

# DataSource configuration for local development
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/dada_island?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:dada}
spring.datasource.password=${MYSQL_PASSWORD:dev_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis configuration
mybatis.mapper-locations=classpath*:mapper/**/*.xml
mybatis.type-aliases-package=com.phz.dadaIsland.domain

# Flyway migration settings
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# RocketMQ base configuration
rocketmq.name-server=${ROCKETMQ_NAMESRV:rocketmq-namesrv:9876}

# JWT token lifetimes
security.jwt.access-token-minutes=${SECURITY_JWT_ACCESS_MINUTES:60}
security.jwt.refresh-token-days=${SECURITY_JWT_REFRESH_DAYS:7}

# Cache settings
app.cache.stats-ttl=${APP_CACHE_STATS_TTL:PT2M}

# User ID generator defaults
app.user-id.node-id=${USER_ID_NODE_ID:0}
app.user-id.epoch-millis=${USER_ID_EPOCH_MILLIS:1704067200000}

# Web server
server.port=${SERVER_PORT:8082}
