version = 0.1

[default.deploy.parameters]
# A new stack name on purpose: the single-table redesign must not replace the
# tables of the original "oakie-stack". Migrate or retire that stack separately.
stack_name = "oakie-v2"
resolve_s3 = true
s3_prefix = "oakie-v2"
region = "us-west-2"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
image_repositories = []

[default.global.parameters]
region = "us-west-2"
